<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit profile</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="wrap"><a class="brand" href="home.html">My Personal Space</a><nav class="nav"><a href="home.html">View profile</a><a href="change-password.html">Security</a><a href="profile-picture.html">Profile picture</a></nav></div></header><main class="wrap"><div class="hero"><p class="eyebrow">Account settings</p><h1>Edit profile</h1><p class="tagline">Change the information shown on your personal page.</p></div><section><form class="panel" id="profile-form"><label class="field">Display name<input id="profile-name" required maxlength="100"></label><label class="field">Short introduction<textarea id="profile-tagline" rows="3" maxlength="300"></textarea></label><button class="button">Save changes</button><p class="message"></p></form></section></main><script src="app.js"></script><script>(async()=>{if(!await requireUser())return;profile=await getProfile();document.querySelector('#profile-name').value=profile.name||'';document.querySelector('#profile-tagline').value=profile.tagline||'';document.querySelector('#profile-form').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('profiles').update({name:document.querySelector('#profile-name').value.trim(),tagline:document.querySelector('#profile-tagline').value.trim()}).eq('id',currentUser.id);setMessage(error?error.message:'Profile saved.',error?'error':'success')}})()</script></body></html>
