<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Personal Space</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="wrap"><a class="brand" href="home.html">My Personal Space</a><nav class="nav"><a href="edit-profile.html">Edit profile</a><a href="change-password.html">Security</a><a href="profile-picture.html">Profile picture</a><a href="#" onclick="signOut()">Log out</a></nav></div></header><main class="wrap"><div class="hero"><p class="eyebrow" id="user-label">Personal space</p><h1 id="name">Loading…</h1><p class="tagline" id="tagline"></p></div><section><div class="avatar-row"><img id="avatar" class="avatar hidden" alt="Profile picture"><div><p class="eyebrow">Your account</p><h2>Welcome back</h2><p class="muted">Use the separate pages above to update your profile, picture, or password.</p></div></div></section></main><script src="app.js"></script><script>(async()=>{if(!await requireUser())return;profile=await getProfile();document.querySelector('#user-label').textContent=`Personal space — @${username}`;name.textContent=profile.name;tagline.textContent=profile.tagline||'';if(profile.avatar_path){avatar.src=avatarUrl(profile.avatar_path);avatar.classList.remove('hidden')}})()</script></body></html>
