<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">Loading…</div>

<div id="auth-screen" style="display:none;">
  <div class="box">
    <div class="eyebrow">Private Space</div>
    <h2 id="auth-title">Log In</h2>
    <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
    <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="auth-submit" onclick="handleAuthSubmit()">Log In</button>
    <div class="switch" id="auth-switch">No account? <a onclick="toggleAuthMode()">Sign up</a></div>
    <div class="error" id="auth-error"></div>
    <div class="info">Each person creates their own username and only sees their own details, photos, and files.</div>
  </div>
</div>

<div id="page-content">
  <div class="nav">
    <a href="edit.html">Edit Page</a>
    <a href="change-password.html">Change Password</a>
    <button onclick="doLogout()">Log Out</button>
  </div>
  <div class="wrap" id="app"></div>
</div>

<script src="app.js"></script>
<script>
let authMode = 'login';

function toggleAuthMode(){
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-title').textContent = authMode === 'login' ? 'Log In' : 'Sign Up';
  document.getElementById('auth-submit').textContent = authMode === 'login' ? 'Log In' : 'Create Account';
  document.getElementById('auth-switch').innerHTML = authMode === 'login'
    ? 'No account? <a onclick="toggleAuthMode()">Sign up</a>'
    : 'Already have an account? <a onclick="toggleAuthMode()">Log in</a>';
  document.getElementById('auth-error').textContent = '';
}

async function handleAuthSubmit(){
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.color = 'var(--danger)';
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = 'Enter both username and password.'; return; }
  if(!/^[a-zA-Z0-9_.-]{3,20}$/.test(username)){ errEl.textContent = 'Username: 3-20 characters, letters/numbers/._- only.'; return; }

  if(authMode === 'signup'){
    const { data: existing } = await sb.from('usernames').select('username').eq('username', username.toLowerCase()).maybeSingle();
    if(existing){ errEl.textContent = 'That username is already taken.'; return; }

    const internalEmail = usernameToInternalEmail(username);
    const { data, error } = await sb.auth.signUp({ email: internalEmail, password });
    if(error){ errEl.textContent = `${error.message} (code: ${error.code || error.status || 'n/a'})`; console.error('Signup error:', error); return; }
    if(!data.user){ errEl.textContent = 'Signup failed, please try again.'; return; }

    const { error: unameErr } = await sb.from('usernames').insert({ username: username.toLowerCase(), email: internalEmail, user_id: data.user.id });
    if(unameErr){ errEl.textContent = unameErr.message; return; }

    await showApp();
  } else {
    const { data: unameRow, error: lookupErr } = await sb.from('usernames').select('email').eq('username', username.toLowerCase()).maybeSingle();
    if(lookupErr || !unameRow){ errEl.textContent = 'Username not found.'; return; }

    const { error } = await sb.auth.signInWithPassword({ email: unameRow.email, password });
    if(error){ errEl.textContent = 'Incorrect password.'; return; }
    await showApp();
  }
}

async function showApp(){
  const { data: { session } } = await sb.auth.getSession();
  document.getElementById('loading').style.display = 'none';
  if(!session || !session.user){
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('page-content').style.display = 'none';
    return;
  }
  const user = session.user;
  const { data: unameRow } = await sb.from('usernames').select('username').eq('user_id', user.id).maybeSingle();
  const username = unameRow ? unameRow.username : 'you';

  const profile = await loadProfile(user.id);
  const avatarUrl = await getAvatarUrl(profile.avatar_path);
  const galleryItems = await loadGallery(user.id);
  const fileItems = await loadFiles(user.id);

  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('page-content').style.display = 'block';
  render(username, profile, avatarUrl, galleryItems, fileItems);
}

function render(username, profile, avatarUrl, galleryItems, fileItems){
  let html = '';

  html += `<div class="hero">
    <div class="avatar-wrap"><img src="${avatarUrl || 'https://placehold.co/240x240/2c2a45/cfc9bb?text=Photo'}" alt="Profile photo"></div>
    <div class="eyebrow">Personal Space — @${esc(username)}</div>
    <h1>${profile.name}</h1>
    <p class="tagline">${profile.tagline}</p>
  </div>`;

  html += `<section><div class="section-label">About</div><h2>Personal Details</h2><ul class="ledger">`;
  profile.details.forEach(row => { html += `<li><span>${esc(row.label)}</span><span>${esc(row.value)}</span></li>`; });
  html += `</ul></section>`;

  html += `<section><div class="section-label">Memories</div><h2>Photo Gallery</h2><div class="gallery">`;
  galleryItems.forEach(p => {
    html += `<figure class="polaroid"><img src="${p.url}" alt="Gallery photo"><figcaption>${esc(p.caption)}</figcaption></figure>`;
  });
  html += `</div></section>`;

  html += `<section><div class="section-label">Documents</div><h2>My Files</h2><ul class="files">`;
  fileItems.forEach(f => {
    html += `<li><a href="${f.url}" download="${esc(f.fileName)}" target="_blank"><span class="fname">${esc(f.label)}</span></a><span class="ftype">${f.fileName.split('.').pop().toUpperCase()}</span></li>`;
  });
  html += `</ul></section>`;

  html += `<section><div class="section-label">Find Me</div><h2>Instagram</h2><div class="social-grid">`;
  profile.social.forEach(s => {
    html += `<div class="social-card"><div class="handle">${esc(s.handle)}</div><div class="role">${esc(s.role)}</div><a href="${s.url}" target="_blank" rel="noopener">Visit profile →</a></div>`;
  });
  html += `</div></section>`;

  html += `<footer>Your own private space.</footer>`;
  document.getElementById('app').innerHTML = html;
}

showApp();
</script>

</body>
</html>
