<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Personal Space</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><div class="hero"><p class="eyebrow">Private space</p><h1 id="title">Log in</h1><p class="tagline">Your details, photos, files, and profile picture are private to your account.</p></div><section><form class="panel" id="auth-form"><label class="field">Username<input id="username" autocomplete="username" pattern="[A-Za-z0-9_.-]{3,20}" required></label><label class="field">Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button class="button" id="submit">Log in</button><p class="message"></p><p class="muted"><a href="#" id="switch" style="color:var(--gold-soft)">Need an account? Sign up</a></p></form></section></main><script src="app.js"></script><script>let mode='login';const form=document.querySelector('#auth-form'),msg=document.querySelector('.message');(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)location.href='home.html'})();document.querySelector('#switch').onclick=e=>{e.preventDefault();mode=mode==='login'?'signup':'login';title.textContent=mode==='login'?'Log in':'Create account';submit.textContent=mode==='login'?'Log in':'Create account';e.target.textContent=mode==='login'?'Need an account? Sign up':'Already have an account? Log in';password.autocomplete=mode==='login'?'current-password':'new-password';msg.textContent=''};form.onsubmit=async e=>{e.preventDefault();const u=username.value.trim().toLowerCase(),p=password.value;if(mode==='signup'){const {data:existing}=await sb.from('usernames').select('username').eq('username',u).maybeSingle();if(existing){setMessage('That username is already taken.','error');return}const email=`${u}.acct@example.com`;const {data,error}=await sb.auth.signUp({email,password:p});if(error||!data.user){setMessage(error?.message||'Could not create account.','error');return}const {error:rowError}=await sb.from('usernames').insert({username:u,email,user_id:data.user.id});if(rowError){setMessage(rowError.message,'error');return}location.href='home.html'}else{const {data:row}=await sb.from('usernames').select('email').eq('username',u).maybeSingle();if(!row){setMessage('Username not found.','error');return}const {error}=await sb.auth.signInWithPassword({email:row.email,password:p});if(error){setMessage('Incorrect password.','error');return}location.href='home.html'}};</script></body></html>
