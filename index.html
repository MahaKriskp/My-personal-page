<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1b1a2e; --ink-soft:#2c2a45; --cream:#f2ede3; --cream-dim:#cfc9bb;
    --gold:#caa15b; --gold-soft:#e4c98a; --line: rgba(242,237,227,0.15);
    --danger:#e07a5f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Inter',sans-serif;line-height:1.6;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0;}
  .wrap{max-width:920px;margin:0 auto;padding:0 24px 40px;}
  input,textarea{font-family:'Inter',sans-serif;}

  .hero{padding:90px 0 40px;border-bottom:1px solid var(--line);}
  .hero .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:14px;}
  .hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-0.01em;}
  .hero p.tagline{max-width:520px;color:var(--cream-dim);font-size:17px;margin-top:14px;}

  section{padding:50px 0;border-bottom:1px solid var(--line);}
  section:last-of-type{border-bottom:none;}
  .section-label{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
  section > h2{font-size:26px;margin-bottom:26px;}

  .ledger{list-style:none;padding:0;margin:0;max-width:620px;}
  .ledger li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px;}
  .ledger li span:first-child{color:var(--cream-dim);text-transform:uppercase;letter-spacing:.06em;font-size:12px;white-space:nowrap;}
  .ledger li span:last-child{text-align:right;font-weight:500;}
  .ledger input{background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:8px 10px;font-size:13px;}
  .ledger .lbl-input{width:120px;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--cream-dim);}
  .ledger .val-input{flex:1;text-align:right;}
  .row-flex{display:flex;align-items:center;gap:8px;width:100%;}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:26px;}
  .polaroid{background:var(--cream);padding:10px 10px 34px;border-radius:2px;box-shadow:0 10px 22px rgba(0,0,0,0.35);transform:rotate(var(--r,0deg));transition:transform .25s ease;position:relative;}
  .polaroid:nth-child(3n+1){--r:-2.5deg;} .polaroid:nth-child(3n+2){--r:1.5deg;} .polaroid:nth-child(3n){--r:-1deg;}
  .polaroid:hover{transform:rotate(0deg) scale(1.03);}
  .polaroid img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#ddd6c4;}
  .polaroid figcaption{color:var(--ink);font-family:'Fraunces',serif;font-size:13px;text-align:center;margin-top:8px;}
  .polaroid .cap-input{width:100%;text-align:center;border:none;background:transparent;color:var(--ink);font-family:'Fraunces',serif;font-size:13px;margin-top:6px;border-bottom:1px dashed #999;}
  .polaroid .file-btn{display:block;width:100%;font-size:11px;margin-top:6px;color:var(--ink);}
  .card-remove{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:14px;line-height:1;}

  .files{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .files li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;background:var(--ink-soft);border:1px solid var(--line);border-radius:8px;}
  .files li a{color:var(--cream);text-decoration:none;font-weight:500;}
  .files li a:hover{color:var(--gold-soft);}
  .files .file-edit-row{display:flex;flex-direction:column;gap:6px;width:100%;}
  .files input{background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:8px 10px;font-size:13px;}

  .social-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .social-card{padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--ink-soft);position:relative;}
  .social-card .handle{font-family:'Fraunces',serif;font-size:19px;color:var(--gold-soft);}
  .social-card .role{font-size:13px;color:var(--cream-dim);margin-top:4px;}
  .social-card a{display:inline-block;margin-top:12px;font-size:13px;color:var(--cream);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px;}
  .social-card input{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:8px 10px;font-size:13px;margin-top:6px;}

  .add-btn{margin-top:18px;padding:10px 18px;border-radius:8px;border:1px dashed var(--gold);background:transparent;color:var(--gold-soft);font-size:13px;cursor:pointer;}
  .add-btn:hover{background:var(--ink-soft);}

  footer{padding:40px 0 20px;text-align:center;color:var(--cream-dim);font-size:13px;}

  #edit-toggle,#logout-btn{position:fixed;top:18px;z-index:500;padding:10px 16px;border-radius:24px;border:1px solid var(--gold);background:var(--ink-soft);color:var(--gold-soft);font-size:13px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.4);}
  #edit-toggle{right:18px;} #logout-btn{right:150px;}
  #edit-toggle:hover,#logout-btn:hover{background:var(--gold);color:var(--ink);}
  #save-toast{position:fixed;bottom:18px;right:18px;background:var(--gold);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s ease;z-index:600;}
  #save-toast.show{opacity:1;}

  .pw-panel{max-width:420px;margin-top:10px;padding:20px;background:var(--ink-soft);border:1px solid var(--line);border-radius:10px;}
  .pw-panel input{width:100%;margin-bottom:10px;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--cream);}
  .pw-panel button{padding:10px 16px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold-soft);cursor:pointer;font-size:13px;}
  .pw-panel button:hover{background:var(--gold);color:var(--ink);}
  .pw-msg{font-size:13px;margin-top:8px;}
  .pw-msg.ok{color:#8fbf8f;} .pw-msg.err{color:var(--danger);}

  #auth-screen{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
  #auth-screen .box{text-align:center;max-width:340px;width:100%;}
  #auth-screen .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:10px;}
  #auth-screen h2{font-size:26px;margin-bottom:22px;}
  #auth-screen input{width:100%;padding:13px 16px;border-radius:8px;border:1px solid var(--line);background:var(--ink-soft);color:var(--cream);font-size:14px;outline:none;margin-bottom:12px;}
  #auth-screen input:focus{border-color:var(--gold);}
  #auth-screen button.primary{width:100%;padding:13px 16px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold-soft);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s ease,color .2s ease;}
  #auth-screen button.primary:hover{background:var(--gold);color:var(--ink);}
  #auth-screen .switch{margin-top:16px;font-size:13px;color:var(--cream-dim);}
  #auth-screen .switch a{color:var(--gold-soft);cursor:pointer;text-decoration:underline;}
  #auth-screen .error{color:var(--danger);font-size:13px;margin-top:12px;min-height:16px;}
  #auth-screen .info{color:var(--cream-dim);font-size:12px;margin-top:10px;}
  #page-content{display:none;}
  #loading{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--cream-dim);z-index:998;}
</style>
</head>
<body>

<div id="loading">Loading…</div>

<div id="auth-screen" style="display:none;">
  <div class="box">
    <div class="eyebrow">Private Space</div>
    <h2 id="auth-title">Log In</h2>
    <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
    <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="auth-submit" onclick="handleAuthSubmit()">Log In</button>
    <div class="switch" id="auth-switch">No account? <a onclick="toggleAuthMode()">Sign up</a></div>
    <div class="error" id="auth-error"></div>
    <div class="info">Each person creates their own username and only sees their own details, photos, and files.</div>
  </div>
</div>

<div id="page-content">
  <button id="logout-btn" onclick="logout()">Log Out</button>
  <button id="edit-toggle" onclick="toggleEdit()">Edit Page</button>
  <div class="wrap" id="app"></div>
  <div id="save-toast">Saved</div>
</div>

<script>
const SUPABASE_URL = "https://lwdgpvybeikpcqlnhqcv.supabase.co";
const SUPABASE_KEY = "sb_publishable_XnRwkKeLauxS3b0Lq-_JZw_TmKbqqwc";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let authMode = 'login';
let currentUser = null;
let editMode = false;
let profile = { name: "Your Name", tagline: "Write a short line about yourself.", details: [], social: [] };
let galleryItems = [];
let fileItems = [];
let currentUsername = '';

function toggleAuthMode(){
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-title').textContent = authMode === 'login' ? 'Log In' : 'Sign Up';
  document.getElementById('auth-submit').textContent = authMode === 'login' ? 'Log In' : 'Create Account';
  document.getElementById('auth-switch').innerHTML = authMode === 'login'
    ? 'No account? <a onclick="toggleAuthMode()">Sign up</a>'
    : 'Already have an account? <a onclick="toggleAuthMode()">Log in</a>';
  document.getElementById('auth-error').textContent = '';
}

function usernameToInternalEmail(username){
  const clean = username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
  return `${clean}.acct@example.com`;
}

async function handleAuthSubmit(){
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.color = 'var(--danger)';
  errEl.textContent = '';
  if(!username || !password){ errEl.textContent = 'Enter both username and password.'; return; }
  if(!/^[a-zA-Z0-9_.-]{3,20}$/.test(username)){ errEl.textContent = 'Username: 3-20 characters, letters/numbers/._- only.'; return; }

  if(authMode === 'signup'){
    const { data: existing } = await sb.from('usernames').select('username').eq('username', username.toLowerCase()).maybeSingle();
    if(existing){ errEl.textContent = 'That username is already taken.'; return; }

    const internalEmail = usernameToInternalEmail(username);
    const { data, error } = await sb.auth.signUp({ email: internalEmail, password });
    if(error){ errEl.textContent = `${error.message} (code: ${error.code || error.status || 'n/a'})`; console.error('Signup error:', error); return; }
    if(!data.user){ errEl.textContent = 'Signup failed, please try again.'; return; }

    const { error: unameErr } = await sb.from('usernames').insert({ username: username.toLowerCase(), email: internalEmail, user_id: data.user.id });
    if(unameErr){ errEl.textContent = unameErr.message; return; }

    currentUsername = username.toLowerCase();
    await onLoggedIn(data.user);
  } else {
    const { data: unameRow, error: lookupErr } = await sb.from('usernames').select('email').eq('username', username.toLowerCase()).maybeSingle();
    if(lookupErr || !unameRow){ errEl.textContent = 'Username not found.'; return; }

    const { data, error } = await sb.auth.signInWithPassword({ email: unameRow.email, password });
    if(error){ errEl.textContent = 'Incorrect password.'; return; }
    currentUsername = username.toLowerCase();
    await onLoggedIn(data.user);
  }
}

async function logout(){
  await sb.auth.signOut();
  currentUser = null;
  currentUsername = '';
  document.getElementById('page-content').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-username').value = '';
  document.getElementById('auth-password').value = '';
}

async function onLoggedIn(user){
  currentUser = user;
  if(!currentUsername){
    const { data: unameRow } = await sb.from('usernames').select('username').eq('user_id', user.id).maybeSingle();
    currentUsername = unameRow ? unameRow.username : 'you';
  }
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('page-content').style.display = 'block';
  await loadProfile();
  await loadGallery();
  await loadFiles();
  render();
}

async function loadProfile(){
  let { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if(!data){
    const defaults = { id: currentUser.id, name: "Your Name", tagline: "Write a short line about yourself.", details: [], social: [] };
    await sb.from('profiles').insert(defaults);
    data = defaults;
  }
  profile = { name: data.name || "Your Name", tagline: data.tagline || "", details: data.details || [], social: data.social || [] };
}
async function saveProfile(){
  await sb.from('profiles').update({ name: profile.name, tagline: profile.tagline, details: profile.details, social: profile.social }).eq('id', currentUser.id);
  toast();
}

async function loadGallery(){
  const { data } = await sb.from('gallery').select('*').eq('user_id', currentUser.id).order('id');
  galleryItems = [];
  for(const row of (data||[])){
    const { data: signed } = await sb.storage.from('photos').createSignedUrl(row.storage_path, 3600);
    galleryItems.push({ id: row.id, storage_path: row.storage_path, caption: row.caption, url: signed ? signed.signedUrl : '' });
  }
}
async function loadFiles(){
  const { data } = await sb.from('files').select('*').eq('user_id', currentUser.id).order('id');
  fileItems = [];
  for(const row of (data||[])){
    const { data: signed } = await sb.storage.from('files').createSignedUrl(row.storage_path, 3600);
    fileItems.push({ id: row.id, storage_path: row.storage_path, label: row.label, fileName: row.storage_path.split('/').pop(), url: signed ? signed.signedUrl : '' });
  }
}

function toast(){
  const t = document.getElementById('save-toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1200);
}

function toggleEdit(){
  editMode = !editMode;
  document.getElementById('edit-toggle').textContent = editMode ? 'Done Editing' : 'Edit Page';
  render();
}

// ---- Profile ----
function updateProfileField(field, val){ profile[field] = val; }
function commitProfile(){ saveProfile(); }

// ---- Details ----
function addDetail(){ profile.details.push({label:"New Field", value:"Value"}); saveProfile(); render(); }
function removeDetail(i){ profile.details.splice(i,1); saveProfile(); render(); }
function updateDetail(i, field, val){ profile.details[i][field] = val; }

// ---- Social ----
function addSocial(){ profile.social.push({handle:"@new_handle", role:"Role", url:"https://instagram.com/new_handle"}); saveProfile(); render(); }
function removeSocial(i){ profile.social.splice(i,1); saveProfile(); render(); }
function updateSocial(i, field, val){ profile.social[i][field] = val; }

// ---- Gallery ----
async function addPhoto(input){
  if(!input.files[0]) return;
  const file = input.files[0];
  const path = `${currentUser.id}/${Date.now()}_${file.name}`;
  const { error: upErr } = await sb.storage.from('photos').upload(path, file);
  if(upErr){ alert('Upload failed: ' + upErr.message); return; }
  await sb.from('gallery').insert({ user_id: currentUser.id, storage_path: path, caption: 'New caption' });
  await loadGallery();
  render();
  toast();
}
async function removePhoto(i){
  const item = galleryItems[i];
  await sb.storage.from('photos').remove([item.storage_path]);
  await sb.from('gallery').delete().eq('id', item.id);
  await loadGallery();
  render();
}
async function updateCaption(i, val){
  galleryItems[i].caption = val;
  await sb.from('gallery').update({ caption: val }).eq('id', galleryItems[i].id);
}

// ---- Files ----
async function addFile(input){
  if(!input.files[0]) return;
  const file = input.files[0];
  const path = `${currentUser.id}/${Date.now()}_${file.name}`;
  const { error: upErr } = await sb.storage.from('files').upload(path, file);
  if(upErr){ alert('Upload failed: ' + upErr.message); return; }
  await sb.from('files').insert({ user_id: currentUser.id, storage_path: path, label: file.name });
  await loadFiles();
  render();
  toast();
}
async function removeFile(i){
  const item = fileItems[i];
  await sb.storage.from('files').remove([item.storage_path]);
  await sb.from('files').delete().eq('id', item.id);
  await loadFiles();
  render();
}
async function updateFileLabel(i, val){
  fileItems[i].label = val;
  await sb.from('files').update({ label: val }).eq('id', fileItems[i].id);
}

// ---- Password ----
async function changePassword(){
  const nw = document.getElementById('pw-new').value;
  const cf = document.getElementById('pw-confirm').value;
  const msg = document.getElementById('pw-msg');
  if(nw.length < 6){ msg.textContent = 'New password should be at least 6 characters.'; msg.className='pw-msg err'; return; }
  if(nw !== cf){ msg.textContent = 'Passwords do not match.'; msg.className='pw-msg err'; return; }
  const { error } = await sb.auth.updateUser({ password: nw });
  if(error){ msg.textContent = error.message; msg.className='pw-msg err'; return; }
  msg.textContent = 'Password updated.'; msg.className='pw-msg ok';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-confirm').value = '';
}

function esc(s){ return (s||'').replace(/"/g,'&quot;'); }

function render(){
  let html = '';

  html += `<div class="hero">
    <div class="eyebrow">Personal Space — @${esc(currentUsername)}</div>
    ${editMode
      ? `<input type="text" value="${esc(profile.name)}" oninput="updateProfileField('name', this.value)" onblur="commitProfile()" style="font-family:'Fraunces',serif;font-size:34px;font-weight:700;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:8px 12px;width:100%;max-width:500px;">
         <textarea oninput="updateProfileField('tagline', this.value)" onblur="commitProfile()" style="margin-top:12px;width:100%;max-width:520px;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:10px 12px;font-size:15px;" rows="2">${esc(profile.tagline)}</textarea>`
      : `<h1>${profile.name}</h1><p class="tagline">${profile.tagline}</p>`}
  </div>`;

  html += `<section><div class="section-label">About</div><h2>Personal Details</h2><ul class="ledger">`;
  profile.details.forEach((row,i)=>{
    if(editMode){
      html += `<li><div class="row-flex">
        <input class="lbl-input" value="${esc(row.label)}" oninput="updateDetail(${i},'label',this.value)" onblur="commitProfile()">
        <input class="val-input" value="${esc(row.value)}" oninput="updateDetail(${i},'value',this.value)" onblur="commitProfile()">
        <button class="card-remove" style="position:static;width:22px;height:22px;font-size:12px;" onclick="removeDetail(${i})">×</button>
      </div></li>`;
    } else {
      html += `<li><span>${row.label}</span><span>${row.value}</span></li>`;
    }
  });
  html += `</ul>${editMode ? `<button class="add-btn" onclick="addDetail()">+ Add Detail</button>` : ''}</section>`;

  html += `<section><div class="section-label">Memories</div><h2>Photo Gallery</h2><div class="gallery">`;
  galleryItems.forEach((p,i)=>{
    html += `<figure class="polaroid">
      ${editMode ? `<button class="card-remove" onclick="removePhoto(${i})">×</button>` : ''}
      <img src="${p.url}" alt="Gallery photo">
      ${editMode
        ? `<input class="cap-input" value="${esc(p.caption)}" oninput="updateCaption(${i}, this.value)" onblur="">`
        : `<figcaption>${p.caption}</figcaption>`}
    </figure>`;
  });
  html += `</div>${editMode ? `<label class="add-btn" style="display:inline-block;cursor:pointer;">+ Add Photo<input type="file" accept="image/*" style="display:none;" onchange="addPhoto(this)"></label>` : ''}</section>`;

  html += `<section><div class="section-label">Documents</div><h2>My Files</h2><ul class="files">`;
  fileItems.forEach((f,i)=>{
    if(editMode){
      html += `<li><div class="file-edit-row">
        <input value="${esc(f.label)}" oninput="updateFileLabel(${i}, this.value)" placeholder="Display name">
        <span style="font-size:12px;color:var(--gold-soft);">File: ${esc(f.fileName)}</span>
      </div><button class="card-remove" style="position:static;width:24px;height:24px;" onclick="removeFile(${i})">×</button></li>`;
    } else {
      html += `<li><a href="${f.url}" download="${esc(f.fileName)}" target="_blank"><span class="fname">${f.label}</span></a><span class="ftype">${f.fileName.split('.').pop().toUpperCase()}</span></li>`;
    }
  });
  html += `</ul>${editMode ? `<label class="add-btn" style="display:inline-block;cursor:pointer;">+ Add File<input type="file" style="display:none;" onchange="addFile(this)"></label>` : ''}</section>`;

  html += `<section><div class="section-label">Find Me</div><h2>Instagram</h2><div class="social-grid">`;
  profile.social.forEach((s,i)=>{
    if(editMode){
      html += `<div class="social-card">
        <button class="card-remove" onclick="removeSocial(${i})">×</button>
        <input value="${esc(s.handle)}" oninput="updateSocial(${i},'handle',this.value)" onblur="commitProfile()" placeholder="@handle">
        <input value="${esc(s.role)}" oninput="updateSocial(${i},'role',this.value)" onblur="commitProfile()" placeholder="Role">
        <input value="${esc(s.url)}" oninput="updateSocial(${i},'url',this.value)" onblur="commitProfile()" placeholder="https://instagram.com/...">
      </div>`;
    } else {
      html += `<div class="social-card">
        <div class="handle">${s.handle}</div>
        <div class="role">${s.role}</div>
        <a href="${s.url}" target="_blank" rel="noopener">Visit profile →</a>
      </div>`;
    }
  });
  html += `</div>${editMode ? `<button class="add-btn" onclick="addSocial()">+ Add Account</button>` : ''}</section>`;

  if(editMode){
    html += `<section><div class="section-label">Security</div><h2>Change Password</h2>
      <div class="pw-panel">
        <input type="password" id="pw-new" placeholder="New password">
        <input type="password" id="pw-confirm" placeholder="Confirm new password">
        <button onclick="changePassword()">Update Password</button>
        <div class="pw-msg" id="pw-msg"></div>
      </div>
    </section>`;
  }

  html += `<footer>Your own private space — only you can see your details, photos, and files.</footer>`;

  document.getElementById('app').innerHTML = html;
}

// ---- Boot ----
(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  document.getElementById('loading').style.display = 'none';
  if(session && session.user){
    await onLoggedIn(session.user);
  } else {
    document.getElementById('auth-screen').style.display = 'flex';
  }
})();
</script>

</body>
</html>
