<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="wrap"><a class="brand" href="home.html">My Personal Space</a><nav class="nav"><a href="home.html">View profile</a><a href="edit-profile.html">Edit profile</a><a href="profile-picture.html">Profile picture</a></nav></div></header><main class="wrap"><div class="hero"><p class="eyebrow">Account security</p><h1>Change password</h1><p class="tagline">Choose a new password for your private account.</p></div><section><form class="panel" id="password-form"><label class="field">New password<input id="new-password" type="password" minlength="6" required autocomplete="new-password"></label><label class="field">Confirm new password<input id="confirm-password" type="password" minlength="6" required autocomplete="new-password"></label><button class="button">Update password</button><p class="message"></p></form></section></main><script src="app.js"></script><script>(async()=>{if(!await requireUser())return;document.querySelector('#password-form').onsubmit=async e=>{e.preventDefault();const p=document.querySelector('#new-password').value;if(p!==document.querySelector('#confirm-password').value)return setMessage('Passwords do not match.','error');const {error}=await sb.auth.updateUser({password:p});setMessage(error?error.message:'Password updated.',error?'error':'success');if(!error)e.target.reset()}})()</script></body></html>
