<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile picture</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="wrap"><a class="brand" href="home.html">My Personal Space</a><nav class="nav"><a href="home.html">View profile</a><a href="edit-profile.html">Edit profile</a><a href="change-password.html">Security</a></nav></div></header><main class="wrap"><div class="hero"><p class="eyebrow">Account settings</p><h1>Profile picture</h1><p class="tagline">This picture belongs only to your own account.</p></div><section><div class="panel"><div class="avatar-row"><div id="placeholder" class="avatar avatar-placeholder">+</div><img id="avatar" class="avatar hidden" alt="Your profile picture"><div><label class="file-label">Choose picture<input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="remove" class="button danger hidden">Remove</button><p class="message"></p></div></div></div></section></main><script src="app.js"></script><script>(async()=>{if(!await requireUser())return;profile=await getProfile();const image=document.querySelector('#avatar'),placeholder=document.querySelector('#placeholder'),remove=document.querySelector('#remove');function show(){if(profile.avatar_path){image.src=avatarUrl(profile.avatar_path);image.classList.remove('hidden');placeholder.classList.add('hidden');remove.classList.remove('hidden')}}show();document.querySelector('#photo-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024)return setMessage('Choose an image under 5 MB.','error');const ext=file.name.split('.').pop();const path=`${currentUser.id}/avatar.${ext}`;if(profile.avatar_path)await sb.storage.from('avatars').remove([profile.avatar_path]);const {error}=await sb.storage.from('avatars').upload(path,file,{upsert:true});if(error)return setMessage(error.message,'error');const result=await sb.from('profiles').update({avatar_path:path}).eq('id',currentUser.id);if(result.error)return setMessage(result.error.message,'error');profile.avatar_path=path;image.src=avatarUrl(path)+'?t='+Date.now();show();setMessage('Profile picture saved.','success')};remove.onclick=async()=>{if(profile.avatar_path)await sb.storage.from('avatars').remove([profile.avatar_path]);await sb.from('profiles').update({avatar_path:null}).eq('id',currentUser.id);profile.avatar_path=null;image.classList.add('hidden');placeholder.classList.remove('hidden');remove.classList.add('hidden');setMessage('Profile picture removed.','success')}})()</script></body></html>
